kind = "web"
previewPath = "/"
title = "Mobile Store"
version = "1.0.0"
id = "artifacts/mobile-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21693

[services.development]
run = "pnpm --filter @workspace/mobile-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile-store", "run", "build" ]
publicDir = "artifacts/mobile-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21693"
BASE_PATH = "/"
